name: Verificar aplicação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  navegador:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          RAE_PAGES: '1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test-browser.py
        env:
          RAE_TEST_BASE_PATH: /rumo-ao-estrelato
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: navegador
          path: entrega/navegador/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: rumo-ao-estrelato-web
          path: out/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out/

  publicar-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: navegador
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Conferir origem do Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" == "workflow" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "Selecione GitHub Actions em Settings → Pages para habilitar a publicação." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.pages.outputs.active == 'true'
